version: "2"

linters:
  default: none
  enable:
    - errcheck # Mandatory. Do not disable.
    - ineffassign # Mandatory. Do not disable.
    - staticcheck # Mandatory. Do not disable.
    - govet
    - gosec
    - bodyclose # https://github.com/timakin/bodyclose
    - gocritic
    - gomodguard_v2
    - nolintlint
  # TODO(v5): enable
  #    - noctx

  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (io.ReadCloser).Close

    gomodguard_v2:
      blocked:
        - module: github.com/pkg/errors
          recommendations:
            - errors
            - github.com/mailgun/errors
          reason: Deprecated at Mailgun.

    govet:
      disable:
        - shadow
        - fieldalignment
      enable-all: true

    staticcheck:
      # https://staticcheck.dev/docs/configuration/options/#checks
      # Example (to disable some checks): [ "all", "-SA1000", "-SA1001"]
      checks:
        - all
        - -ST1003 # TODO(v5): add JSON tags and enable (https://staticcheck.dev/docs/checks/#ST1003)

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$

issues:
  max-issues-per-linter: 0
  max-same-issues: 50

formatters:
  enable:
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$

run:
  tests: true